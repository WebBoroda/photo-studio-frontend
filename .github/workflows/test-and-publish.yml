name: Frontend QA and Pages
on:
  push:
    branches: [main]
    paths: ['index.html', 'assets/**', 'tests/**', 'package.json', 'playwright.config.cjs']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - run: npm test
      - name: QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: |
            test-results/
            test-report/
          if-no-files-found: ignore
          retention-days: 14
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
